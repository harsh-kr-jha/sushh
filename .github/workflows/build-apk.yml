name: Build Goonj APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Build official debug APK
        run: ./gradlew --no-daemon :briar-android:assembleOfficialDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p apk
          cp briar-android/build/outputs/apk/official/debug/*.apk apk/Goonj-debug.apk
          sha256sum apk/Goonj-debug.apk > apk/Goonj-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Goonj-debug-apk-${{ github.run_number }}
          path: |
            apk/Goonj-debug.apk
            apk/Goonj-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
