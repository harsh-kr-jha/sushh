name: Build downloadable Android APK

on:
  push:
    branches:
      - sushh-hub
      - sushh-participant
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build ${{ github.ref_name }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build installable debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testOfficialDebugUnitTest assembleOfficialDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-apk
          path: briar-android/build/outputs/apk/official/debug/*.apk
          if-no-files-found: error
          retention-days: 30
